# Version: 1.3.0
blueprint:
  domain: automation
  name: "🔋 Accu Saver - Battery Health Manager"
  author: r3mcos3
  source_url: https://github.com/r3mcos3/blueprints/blob/main/accu_saver/accu_saver.yaml
  homeassistant:
    min_version: 2025.12.0
  description: >
    📦 [Version 1.3.0] Smart battery health management for laptop servers!
    Automatically controls charging via smart plug to maintain optimal battery levels
    and extend battery lifespan. 🔌⚡


    Features:

    - 🔋 Battery level monitoring with dual thresholds

    - ⚡ Automatic charge control via smart plug

    - 🎯 Configurable upper/lower battery limits

    - 🔄 Immediate response - no delays

    - ⏰ Periodic status checks every 5 minutes

    - 🛡️ Prevents overcharging and deep discharge

    - 🚀 Startup synchronization for correct initial state

  input:
    # ===== REQUIRED: BATTERY SENSOR =====
    battery_sensor:
      name: "🔋 Battery Percentage Sensor"
      description: >
        The sensor that monitors battery level percentage (e.g., sensor.laptop_battery_level).
        Must report values between 0-100.
      selector:
        entity:
          filter:
            - domain: sensor

    # ===== REQUIRED: SMART PLUG CONTROL =====
    smart_plug:
      name: "🔌 Smart Plug/Switch"
      description: >
        The smart plug or switch controlling the charger.
        Turning OFF stops charging, turning ON resumes charging.
      selector:
        entity:
          filter:
            - domain: switch

    # ===== BATTERY THRESHOLD SETTINGS =====
    battery_thresholds:
      name: "🎯 Battery Threshold Settings"
      icon: mdi:battery-charging
      collapsed: true
      input:
        upper_threshold:
          name: "⬆️ Upper Threshold (Stop Charging)"
          description: >
            When battery reaches this percentage, charging will stop.
            Recommended: 80% for optimal battery health.
          default: 80
          selector:
            number:
              min: 50
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        lower_threshold:
          name: "⬇️ Lower Threshold (Start Charging)"
          description: >
            When battery drops to this percentage, charging will resume.
            Recommended: 20% to avoid deep discharge.
          default: 20
          selector:
            number:
              min: 5
              max: 50
              step: 5
              unit_of_measurement: "%"
              mode: slider

mode: single
max_exceeded: silent

variables:
  # Input references
  battery: !input battery_sensor
  plug: !input smart_plug
  upper_limit: !input upper_threshold
  lower_limit: !input lower_threshold

triggers:
  # ===== BATTERY LEVEL TRIGGERS =====
  - trigger: numeric_state
    entity_id: !input battery_sensor
    above: !input upper_threshold
    id: battery_high

  - trigger: numeric_state
    entity_id: !input battery_sensor
    below: !input lower_threshold
    id: battery_low

  # ===== STARTUP TRIGGERS =====
  - trigger: homeassistant
    event: start
    id: ha_start

  - trigger: event
    event_type: automation_reloaded
    id: automation_reload

  # ===== SENSOR RECOVERY TRIGGER =====
  - trigger: state
    entity_id: !input battery_sensor
    from:
      - "unavailable"
      - "unknown"
    id: sensor_recovered

  # ===== PERIODIC CHECK TRIGGER =====
  - trigger: time_pattern
    minutes: "/5"
    id: periodic_check

# Guard against a misconfigured window (upper must be above lower), which would make the plug flip constantly
conditions:
  - condition: template
    value_template: "{{ upper_limit | float(80) > lower_limit | float(20) }}"

actions:
  # ===== STARTUP / RELOAD: WAIT FOR SENSORS =====
  # The delay must come before the state is read below, otherwise stale values are used
  - if:
      - condition: trigger
        id:
          - ha_start
          - automation_reload
    then:
      - delay:
          seconds: 10

  # ===== READ CURRENT STATE =====
  - variables:
      battery_sensor_available: "{{ states(battery) | is_number }}"
      current_battery_level: "{{ states(battery) | float(0) }}"
      plug_is_on: "{{ is_state(plug, 'on') }}"

  # ===== SYNC PLUG WITH BATTERY LEVEL =====
  # Every trigger runs the same idempotent check, so a threshold crossing, a restart,
  # a recovered sensor and the periodic check all end up in the same correct state.
  - if:
      - condition: template
        value_template: "{{ battery_sensor_available }}"
    then:
      - choose:
          # Battery at/above upper threshold - ensure charging is OFF
          - conditions:
              - condition: template
                value_template: "{{ current_battery_level >= upper_limit }}"
              - condition: template
                value_template: "{{ plug_is_on }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: "{{ plug }}"

          # Battery at/below lower threshold - ensure charging is ON
          - conditions:
              - condition: template
                value_template: "{{ current_battery_level <= lower_limit }}"
              - condition: template
                value_template: "{{ not plug_is_on }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ plug }}"
