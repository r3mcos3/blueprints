# Version: 1.1.0
blueprint:
  domain: automation
  name: 🔈 Volume Control!
  author: r3mcos3
  source_url: https://github.com/r3mcos3/blueprints/blob/main/volumecontrol/volumecontrol.yaml
  homeassistant:
    min_version: 2025.12.0
  description: >
    📦 [Version 1.1.0] Blueprint to automate all your speakers 🔈

  input:
    media:
      name: 📻 Media Players
      description: >
        `Speakers`


        Speakers to use.
      default: []
      selector:
        target:
          entity:
            - domain:
                - media_player
    scheduler:
      name: 🗓️ Scheduler
      description: >
        `Scheduler`


        for more information about schedulers click [here](https://www.home-assistant.io/integrations/schedule/)

        to make your scheduler click [here](https://my.home-assistant.io/redirect/helpers/).
      default: []
      selector:
        entity:
          filter:
            - domain:
                - schedule
    volume_up:
      name: 🔊 Volume Up Level
      description: >
        `Volume High Setting`


        The volume goes to this level when the scheduler goes to on
      default: 0.6
      selector:
        number:
          min: 0.05
          max: 1.0
          step: 0.05
          mode: slider
    volume_down:
      name: 🔈 Volume Down Level
      description: >
        `Volume Low Setting`


        The volume goes to this level when the scheduler goes to off
      default: 0.2
      selector:
        number:
          min: 0.05
          max: 1.0
          step: 0.05
          mode: slider
    custom_action:
      name: 🎬 Custom Action
      description: >
        `Custom Action` `Optional`


        This custom action gets executed if scheduler get to 'on' or 'off'
      default: []
      selector:
        action:
mode: single

triggers:
  - trigger: state
    entity_id: !input scheduler
    to: "on"
    id: schedule_on
  - trigger: state
    entity_id: !input scheduler
    to: "off"
    id: schedule_off
  # Bring the speakers in line with the schedule after a restart or when the automation is reloaded
  - trigger: homeassistant
    event: start
    id: sync
  - trigger: event
    event_type: automation_reloaded
    id: sync

variables:
  scheduler_entity: !input scheduler

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'schedule_on' or (trigger.id == 'sync' and is_state(scheduler_entity, 'on')) }}
        sequence:
          - action: media_player.volume_set
            continue_on_error: true
            target: !input media
            data:
              volume_level: !input volume_up
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'schedule_off' or (trigger.id == 'sync' and is_state(scheduler_entity, 'off')) }}
        sequence:
          - action: media_player.volume_set
            continue_on_error: true
            target: !input media
            data:
              volume_level: !input volume_down
  # Optional custom action: runs when the schedule changes, not on the startup sync
  - if:
      - condition: template
        value_template: "{{ trigger.id != 'sync' }}"
    then: !input custom_action
