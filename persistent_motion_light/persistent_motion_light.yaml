# Version: 1.2.0
blueprint:
  name: 🛡️ Persistent Motion Light 💡
  author: r3mcos3
  source_url: https://github.com/r3mcos3/blueprints/blob/main/persistent_motion_light/persistent_motion_light.yaml
  description: >
    📦 [Version 1.2.0] This blueprint ensures your light stays **ON** as long as there is motion.

    ## 💡 Control a light based on motion

    ### 🛡️ Safety Feature
    If the light is turned **OFF** manually while motion is still detected,
    this automation will **immediately turn it back on**.

    The light will only turn off after:
    1. 🛑 Motion has completely stopped.
    2. ⏳ The wait time has passed.
  domain: automation
  homeassistant:
    min_version: 2025.12.0
  input:
    motion_entity:
      name: 👀 Motion Sensor
      description: The sensor that detects motion.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
    light_entity:
      name: 💡 Light or Switch
      description: The light or switch to control. This entity will be monitored for manual turn-off attempts.
      selector:
        entity:
          filter:
            - domain:
                - light
                - switch
    no_motion_wait:
      name: ⏳ Wait time (No Motion)
      description: Time to leave the light on after motion stops.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: slider

# If motion is detected OR the light is turned off, we restart the logic.
mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"
  - trigger: state
    entity_id: !input light_entity
    from: "on"
    to: "off"

actions:
  # Crucial Check: Only proceed if there is currently motion.
  # If the light was turned off and there is NO motion, we respect that and do nothing (it stays off).
  # If motion started the automation, this condition is obviously true.
  - condition: state
    entity_id: !input motion_entity
    state: "on"

  # Force the light ON
  - action: homeassistant.turn_on
    target:
      entity_id: !input light_entity

  # Wait until motion stops
  - wait_for_trigger:
      - trigger: state
        entity_id: !input motion_entity
        from: "on"
        to: "off"

  # Wait for the cooldown period
  - delay: !input no_motion_wait

  # Turn off the light
  - action: homeassistant.turn_off
    target:
      entity_id: !input light_entity
