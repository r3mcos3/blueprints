# Version: 1.2.0
blueprint:
  name: "☀️ Sun Notifications"
  description: >
    📦 [Version 1.2.0] Get notified at sunrise and sunset via Telegram. 🌅
  domain: automation
  author: r3mcos3
  source_url: https://github.com/r3mcos3/blueprints/blob/main/sun_notifications/sun_notifications.yaml
  homeassistant:
    min_version: 2025.12.0

  input:
    # ══════════════════════════════════════════════════════════════════════════
    # NOTIFICATION SETTINGS
    # ══════════════════════════════════════════════════════════════════════════
    notification_target:
      name: 📱 Telegram Bot
      description: Select the Telegram Bot integration to use for notifications.
      selector:
        config_entry:
          integration: telegram_bot

    # ══════════════════════════════════════════════════════════════════════════
    # SUNRISE SETTINGS
    # ══════════════════════════════════════════════════════════════════════════
    sunrise_enabled:
      name: 🌅 Enable Sunrise Notification
      description: "If enabled, sends a notification when the sun rises."
      default: true
      selector:
        boolean:

    sunrise_offset:
      name: ⏰ Sunrise Offset
      description: "Offset from the sunrise event. Pick a preset or type your own as HH:MM:SS, with a leading '-' for before (e.g. '-00:20:00')."
      default: "00:00:00"
      selector:
        select:
          custom_value: true
          mode: dropdown
          options:
            - label: "2 hours before"
              value: "-02:00:00"
            - label: "1 hour before"
              value: "-01:00:00"
            - label: "45 minutes before"
              value: "-00:45:00"
            - label: "30 minutes before"
              value: "-00:30:00"
            - label: "15 minutes before"
              value: "-00:15:00"
            - label: "10 minutes before"
              value: "-00:10:00"
            - label: "5 minutes before"
              value: "-00:05:00"
            - label: "Exactly at the moment"
              value: "00:00:00"
            - label: "5 minutes after"
              value: "00:05:00"
            - label: "10 minutes after"
              value: "00:10:00"
            - label: "15 minutes after"
              value: "00:15:00"
            - label: "30 minutes after"
              value: "00:30:00"
            - label: "45 minutes after"
              value: "00:45:00"
            - label: "1 hour after"
              value: "01:00:00"
            - label: "2 hours after"
              value: "02:00:00"

    sunrise_message:
      name: 💬 Sunrise Message
      description: "The message to send at sunrise. Templates are supported."
      default: "De zon komt op ☀️"
      selector:
        text:

    # ══════════════════════════════════════════════════════════════════════════
    # SUNSET SETTINGS
    # ══════════════════════════════════════════════════════════════════════════
    sunset_enabled:
      name: 🌇 Enable Sunset Notification
      description: "If enabled, sends a notification when the sun sets."
      default: true
      selector:
        boolean:

    sunset_offset:
      name: ⏰ Sunset Offset
      description: "Offset from the sunset event. Pick a preset or type your own as HH:MM:SS, with a leading '-' for before (e.g. '-00:20:00')."
      default: "00:00:00"
      selector:
        select:
          custom_value: true
          mode: dropdown
          options:
            - label: "2 hours before"
              value: "-02:00:00"
            - label: "1 hour before"
              value: "-01:00:00"
            - label: "45 minutes before"
              value: "-00:45:00"
            - label: "30 minutes before"
              value: "-00:30:00"
            - label: "15 minutes before"
              value: "-00:15:00"
            - label: "10 minutes before"
              value: "-00:10:00"
            - label: "5 minutes before"
              value: "-00:05:00"
            - label: "Exactly at the moment"
              value: "00:00:00"
            - label: "5 minutes after"
              value: "00:05:00"
            - label: "10 minutes after"
              value: "00:10:00"
            - label: "15 minutes after"
              value: "00:15:00"
            - label: "30 minutes after"
              value: "00:30:00"
            - label: "45 minutes after"
              value: "00:45:00"
            - label: "1 hour after"
              value: "01:00:00"
            - label: "2 hours after"
              value: "02:00:00"

    sunset_message:
      name: 💬 Sunset Message
      description: "The message to send at sunset. Templates are supported."
      default: "De zon gaat onder 🌃"
      selector:
        text:

triggers:
  # Disabled events are not registered at all (enabled is set from the toggles above)
  - trigger: sun
    event: sunrise
    offset: !input sunrise_offset
    id: sunrise_trigger
    enabled: !input sunrise_enabled
  - trigger: sun
    event: sunset
    offset: !input sunset_offset
    id: sunset_trigger
    enabled: !input sunset_enabled

actions:
  - choose:
      # Sunrise Case
      - conditions:
          - condition: trigger
            id: sunrise_trigger
        sequence:
          - action: telegram_bot.send_message
            data:
              config_entry_id: !input notification_target
              message: !input sunrise_message
      # Sunset Case
      - conditions:
          - condition: trigger
            id: sunset_trigger
        sequence:
          - action: telegram_bot.send_message
            data:
              config_entry_id: !input notification_target
              message: !input sunset_message

mode: single
