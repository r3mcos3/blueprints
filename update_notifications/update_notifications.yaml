# Version: 2.7.0
blueprint:
  name: "🔄 Update Notifications"
  description: >
    📦 [Version 2.7.0] Get notified about Home Assistant updates via Mobile App!
    Receive notifications when updates are available for core, addons, or integrations.
    Includes actionable buttons to install or skip updates directly from the notification. 🚀
  domain: automation
  author: r3mcos3
  source_url: https://github.com/r3mcos3/blueprints/blob/main/update_notifications/update_notifications.yaml
  homeassistant:
    min_version: 2025.12.0

  input:
    # ══════════════════════════════════════════════════════════════════════════
    # 🔄 UPDATE SETTINGS
    # ══════════════════════════════════════════════════════════════════════════
    update_entities:
      name: 🔄 Update Entities
      description: >
        Select the update entities to monitor. You'll be notified when any of these have an update available.
      selector:
        entity:
          filter:
            - domain: update
          multiple: true

    # ══════════════════════════════════════════════════════════════════════════
    # 📱 NOTIFICATION SETTINGS (COLLAPSED)
    # ══════════════════════════════════════════════════════════════════════════
    notification_settings:
      name: 📱 Notification Settings
      icon: mdi:bell
      description: Configure notification settings.
      collapsed: true
      input:
        mobile_app_device:
          name: 📱 Mobile Device
          description: Select your mobile device(s) for notifications.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

        send_to_ha:
          name: 🏠 Send to HA
          description: Also send as a persistent notification in Home Assistant.
          default: false
          selector:
            boolean:

    # ══════════════════════════════════════════════════════════════════════════
    # ⏰ REMINDER SETTINGS (COLLAPSED)
    # ══════════════════════════════════════════════════════════════════════════
    reminder_settings:
      name: ⏰ Reminder Settings
      icon: mdi:clock-alert
      description: Configure periodic reminders for pending updates.
      collapsed: true
      input:
        reminder_hours:
          name: ⏰ Reminder Interval
          description: >
            Send reminders for pending updates every X hours/minutes.
            Set to "None" to disable reminders.
          default: "3"
          selector:
            select:
              options:
                - label: Disabled
                  value: "None"
                - label: Every 5 minutes (testing)
                  value: "0.083"
                - label: Every 15 minutes (testing)
                  value: "0.25"
                - label: Every 30 minutes (testing)
                  value: "0.5"
                - label: Every hour
                  value: "1"
                - label: Every 2 hours
                  value: "2"
                - label: Every 3 hours
                  value: "3"
                - label: Every 6 hours
                  value: "6"
                - label: Every 12 hours
                  value: "12"
                - label: Every 24 hours
                  value: "24"

        only_after:
          name: 🌅 Only After
          description: Only send notifications after this time.
          default: "07:00:00"
          selector:
            time:

        only_before:
          name: 🌙 Only Before
          description: Only send notifications before this time.
          default: "22:00:00"
          selector:
            time:

    # ══════════════════════════════════════════════════════════════════════════
    # 🔧 ADVANCED SETTINGS (COLLAPSED)
    # ══════════════════════════════════════════════════════════════════════════
    advanced_settings:
      name: 🔧 Advanced Settings
      icon: mdi:cog
      description: Backup and config check options.
      collapsed: true
      input:
        take_backup:
          name: 💾 Take Backup
          description: Create a partial backup before updating (if supported).
          default: true
          selector:
            boolean:

        run_config_check:
          name: ✅ Run Config Check
          description: >
            Run the "Check Configuration" addon when a core update is available.
            You must include the core update entity in your monitored entities.
          default: false
          selector:
            boolean:

        changelog_urls:
          name: 📋 Custom Changelog URLs
          description: >
            Optional: Provide custom changelog URLs for entities that don't have one.
            Format: {"update.addon_name": "https://github.com/..."}
          default: {}
          selector:
            object:

mode: parallel
max: 100

trigger_variables:
  _reminder_hours: !input reminder_hours
  reminder_hours: "{{ _reminder_hours | default('None') }}"
  reminder_hours_float: "{{ 0 if reminder_hours == 'None' else reminder_hours | float(0) }}"
  reminder_minutes: "{{ (reminder_hours_float * 60) | round(0) | int(0) }}"
  run_config_check: !input run_config_check
  update_entities: !input update_entities

triggers:
  # New update available
  - id: new
    trigger: state
    entity_id: !input update_entities
    to: "on"

  # Update started
  - id: started
    trigger: state
    entity_id: !input update_entities
    attribute: in_progress
    from: false
    to: true

  # Update completed
  - id: done
    trigger: state
    entity_id: !input update_entities
    from: "on"
    to: "off"

  # HA startup - check for pending updates
  - id: ha_start
    trigger: homeassistant
    event: start

  # Periodic reminder
  - id: reminder
    trigger: template
    enabled: "{{ reminder_minutes > 0 }}"
    value_template: >
      {% set total_minutes = now().hour * 60 + now().minute %}
      {{ states.update | selectattr('entity_id', 'in', update_entities) | selectattr('state', 'eq', 'on') | list | count > 0
        and reminder_minutes > 0
        and total_minutes % reminder_minutes == 0 }}

  # Core config check completed
  - id: core_check
    trigger: template
    value_template: >
      {% set ns = namespace(core=none) %}
      {% for u in integration_entities('hassio') | select('in', update_entities)
            if (device_attr(u, 'identifiers') | first)[1] == 'core' %}
          {% set ns.core = u %}
      {% endfor %}
      {% if run_config_check and ns.core is string and expand(ns.core) | first | attr('state') == 'on' %}
        {% for e in expand(integration_entities('hassio')) | selectattr('attributes.device_class', 'eq', 'running')
              if (device_attr(e.entity_id, 'identifiers') | first)[1] == 'core_check_config' %}
            {{ e.state == 'off' and e.last_changed > expand(ns.core) | first | attr('last_changed') }}
        {% endfor %}
      {% else %}
        {{ false }}
      {% endif %}

  # Mobile app callback for install/skip buttons
  - id: mobile_callback
    trigger: event
    event_type: mobile_app_notification_action

variables:
  mobile_app_device: !input mobile_app_device
  send_to_ha: !input send_to_ha
  take_backup: !input take_backup
  _changelog_urls: !input changelog_urls
  changelog_urls: "{{ _changelog_urls if _changelog_urls is mapping else {} }}"
  core_update_entity: >
    {% for u in integration_entities('hassio') | select('search', '^update[.]')
          if (device_attr(u, 'identifiers') | first)[1] == 'core' %}
        {{ u }}
    {% endfor %}
  # Callback variables - Mobile App
  callback_action: "{{ trigger.event.data.action | default('') if trigger.id == 'mobile_callback' else '' }}"
  callback_entity_id: >
    {% if trigger.id == 'mobile_callback' and trigger.event.data.tag is string %}
      {% set tag = trigger.event.data.tag %}
      {% set clean_tag = tag | regex_replace('^(reminder_|config_check_)', '') %}
      {{ 'update.' ~ clean_tag if not clean_tag.startswith('update.') else clean_tag }}
    {% else %}

    {% endif %}

actions:
  choose:
    # ════════════════════════════════════════════════════════════════════════
    # UPDATE COMPLETED
    # ════════════════════════════════════════════════════════════════════════
    - alias: Update completed
      conditions: "{{ trigger.id == 'done' }}"
      sequence:
        - variables:
            entity_id: "{{ trigger.entity_id }}"
            friendly_name: "{{ state_attr(trigger.entity_id, 'friendly_name') }}"
            # The state also goes on -> off when an update is SKIPPED: then the installed version is still the old one
            was_installed: >
              {{ state_attr(trigger.entity_id, 'installed_version') == state_attr(trigger.entity_id, 'latest_version') }}

        - alias: Send Mobile App completion notification (or clear it after a skip)
          repeat:
            for_each: "{{ mobile_app_device }}"
            sequence:
              - variables:
                  device_name: "{{ device_attr(repeat.item, 'name') | slugify }}"
              - if:
                  - condition: template
                    value_template: "{{ was_installed }}"
                then:
                  - action: notify.mobile_app_{{ device_name }}
                    continue_on_error: true
                    data:
                      title: "✅ Update Complete"
                      message: "{{ friendly_name }} update completed!"
                      data:
                        tag: "{{ entity_id[7:] }}"
                else:
                  - action: notify.mobile_app_{{ device_name }}
                    continue_on_error: true
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ entity_id[7:] }}"
              - alias: Clear a pending reminder for this update
                action: notify.mobile_app_{{ device_name }}
                continue_on_error: true
                data:
                  message: clear_notification
                  data:
                    tag: "reminder_{{ entity_id[7:] }}"

        - alias: Dismiss HA notification if enabled
          if:
            - condition: template
              value_template: "{{ send_to_ha }}"
          then:
            - action: persistent_notification.dismiss
              data:
                notification_id: "update_{{ entity_id[7:] }}"

    # ════════════════════════════════════════════════════════════════════════
    # NEW UPDATE AVAILABLE
    # ════════════════════════════════════════════════════════════════════════
    - alias: New update available
      conditions: "{{ trigger.id == 'new' }}"
      sequence:
        - variables:
            entity_id: "{{ trigger.entity_id }}"
            friendly_name: "{{ state_attr(entity_id, 'friendly_name') }}"
            latest_version: "{{ state_attr(entity_id, 'latest_version') }}"
            installed_version: "{{ state_attr(entity_id, 'installed_version') }}"
            release_summary: "{{ state_attr(entity_id, 'release_summary') | default('', true) }}"
            release_url: >
              {{ state_attr(entity_id, 'release_url')
                | default(changelog_urls[entity_id] | default('', true), true) }}
            # Update entities without a device have no identifiers
            ids: >
              {% set i = device_attr(entity_id, 'identifiers') %}
              {{ (i | list | first) if i else ('', '') }}
            include_core_check: "{{ run_config_check and ids[0] == 'hassio' and ids[1] == 'core' }}"

        - alias: Send to HA if enabled
          if:
            - condition: template
              value_template: "{{ send_to_ha }}"
          then:
            - action: persistent_notification.create
              data:
                notification_id: "update_{{ entity_id[7:] }}"
                title: "🔄 {{ friendly_name }}"
                message: >
                  **New version:** {{ latest_version }}

                  **Installed:** {{ installed_version }}
                  {% if release_summary %}

                  {{ release_summary }}
                  {% endif %}
                  {% if release_url %}

                  [View Changelog]({{ release_url }})
                  {% endif %}

        - alias: Start config check if core update
          if:
            - condition: template
              value_template: "{{ include_core_check }}"
          then:
            - action: hassio.addon_start
              data:
                addon: core_check_config

        - alias: Outside the notification window - wait until it opens
          if:
            - condition: not
              conditions:
                - condition: time
                  after: !input only_after
                  before: !input only_before
          then:
            - wait_for_trigger:
                - trigger: time
                  at: !input only_after
            - alias: Stop when the update was installed or skipped in the meantime
              condition: template
              value_template: "{{ is_state(entity_id, 'on') }}"

        - alias: Send Mobile App notification
          repeat:
            for_each: "{{ mobile_app_device }}"
            sequence:
              - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                continue_on_error: true
                data:
                  title: "🔄 {{ friendly_name }}"
                  message: >
                    📦 {{ latest_version }} (installed: {{ installed_version }})
                    {% if release_summary %}{{ release_summary | truncate(100) }}{% endif %}
                  data:
                    actions: >
                      {% set actions = [
                        {'action': 'install_update', 'title': '✅ Install'},
                        {'action': 'skip_update', 'title': '⏭️ Skip'}
                      ] %}
                      {% if release_url %}
                        {% set actions = actions + [{'action': 'URI', 'title': '📋 Changelog', 'uri': release_url}] %}
                      {% endif %}
                      {{ actions }}
                    tag: "{{ entity_id[7:] }}"
                    url: "{{ release_url if release_url else '/config/updates' }}"
                    clickAction: "{{ release_url if release_url else '/config/updates' }}"

    # ════════════════════════════════════════════════════════════════════════
    # UPDATE STARTED
    # ════════════════════════════════════════════════════════════════════════
    - alias: Update started
      conditions: "{{ trigger.id == 'started' }}"
      sequence:
        - variables:
            entity_id: "{{ trigger.entity_id }}"
            friendly_name: "{{ state_attr(entity_id, 'friendly_name') }}"

        - alias: Check time window
          condition: time
          after: !input only_after
          before: !input only_before

        - alias: Send Mobile App updating notification
          repeat:
            for_each: "{{ mobile_app_device }}"
            sequence:
              - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                data:
                  title: "⏳ Updating..."
                  message: "{{ friendly_name }} is updating..."
                  data:
                    tag: "{{ entity_id[7:] }}"

    # ════════════════════════════════════════════════════════════════════════
    # CONFIG CHECK COMPLETED
    # ════════════════════════════════════════════════════════════════════════
    - alias: Core config check completed
      conditions: "{{ trigger.id == 'core_check' }}"
      sequence:
        - variables:
            entity_id: "{{ core_update_entity }}"
            friendly_name: "{{ state_attr(entity_id, 'friendly_name') }}"
            latest_version: "{{ state_attr(entity_id, 'latest_version') }}"
            release_url: >
              {{ state_attr(entity_id, 'release_url')
                | default(changelog_urls[entity_id] | default('', true), true) }}

        - alias: Outside the notification window - wait until it opens
          if:
            - condition: not
              conditions:
                - condition: time
                  after: !input only_after
                  before: !input only_before
          then:
            - wait_for_trigger:
                - trigger: time
                  at: !input only_after
            - alias: Stop when the update was installed or skipped in the meantime
              condition: template
              value_template: "{{ is_state(entity_id, 'on') }}"

        - alias: Send Mobile App config check notification
          repeat:
            for_each: "{{ mobile_app_device }}"
            sequence:
              - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                data:
                  title: "✅ Config Check Complete"
                  message: "{{ friendly_name }} {{ latest_version }} - Check addon logs before updating"
                  data:
                    actions: >
                      {% set actions = [
                        {'action': 'install_update', 'title': '✅ Install'},
                        {'action': 'skip_update', 'title': '⏭️ Skip'}
                      ] %}
                      {% if release_url %}
                        {% set actions = actions + [{'action': 'URI', 'title': '📋 Changelog', 'uri': release_url}] %}
                      {% endif %}
                      {{ actions }}
                    tag: "config_check_{{ entity_id[7:] }}"

    # ════════════════════════════════════════════════════════════════════════
    # HA STARTUP - DISMISS OLD NOTIFICATIONS
    # ════════════════════════════════════════════════════════════════════════
    - alias: On HA startup, dismiss notifications of updates that are no longer pending
      conditions: "{{ trigger.id == 'ha_start' }}"
      sequence:
        - repeat:
            for_each: "{{ update_entities | select('is_state', 'off') | list }}"
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "update_{{ repeat.item[7:] }}"

    # ════════════════════════════════════════════════════════════════════════
    # PERIODIC REMINDERS
    # ════════════════════════════════════════════════════════════════════════
    - alias: Send periodic reminders
      conditions: "{{ trigger.id == 'reminder' }}"
      sequence:
        - variables:
            pending_updates: >
              {{ states.update
                | selectattr('entity_id', 'in', update_entities)
                | selectattr('state', 'eq', 'on')
                | rejectattr('attributes.in_progress', 'true')
                | map(attribute='entity_id') | list }}
            update_count: "{{ pending_updates | count }}"

        - alias: Check time window
          condition: time
          after: !input only_after
          before: !input only_before

        - alias: Send reminder if updates pending
          if:
            - condition: template
              value_template: "{{ update_count > 0 }}"
          then:
            - repeat:
                for_each: "{{ mobile_app_device }}"
                sequence:
                  - variables:
                      device_name: "{{ device_attr(repeat.item, 'name') | slugify }}"
                  - repeat:
                      for_each: "{{ pending_updates }}"
                      sequence:
                        - variables:
                            reminder_release_url: >
                              {{ state_attr(repeat.item, 'release_url')
                                | default(changelog_urls[repeat.item] | default('', true), true) }}
                        - action: "notify.mobile_app_{{ device_name }}"
                          continue_on_error: true
                          data:
                            title: "🔔 Update Reminder"
                            message: >
                              {{ state_attr(repeat.item, 'friendly_name') }}
                              📦 {{ state_attr(repeat.item, 'latest_version') }}
                            data:
                              actions: >
                                {% set actions = [
                                  {'action': 'install_update', 'title': '✅ Install'},
                                  {'action': 'skip_update', 'title': '⏭️ Skip'}
                                ] %}
                                {% if reminder_release_url %}
                                  {% set actions = actions + [{'action': 'URI', 'title': '📋 Changelog', 'uri': reminder_release_url}] %}
                                {% endif %}
                                {{ actions }}
                              tag: "reminder_{{ repeat.item[7:] }}"

    # ════════════════════════════════════════════════════════════════════════
    # MOBILE APP CALLBACK - INSTALL UPDATE
    # ════════════════════════════════════════════════════════════════════════
    - alias: Handle Mobile App install callback
      conditions:
        - "{{ trigger.id == 'mobile_callback' }}"
        - "{{ callback_action == 'install_update' }}"
        # Only our own, monitored update entities (other automations/apps use this event too)
        - "{{ callback_entity_id in update_entities }}"
      sequence:
        - alias: Log callback data for debugging
          action: system_log.write
          data:
            message: "Install callback received - Action: {{ callback_action }}, Raw tag: {{ trigger.event.data.tag }}, Clean Entity: {{ callback_entity_id }}"
            level: info
            logger: blueprints.update_notifications

        - alias: Check if entity_id is valid
          if:
            - condition: template
              value_template: "{{ callback_entity_id == '' or states(callback_entity_id) == 'unknown' }}"
          then:
            - stop: "Invalid update entity"
          else:
            - alias: Check if update is still available
              if:
                - condition: template
                  value_template: "{{ states(callback_entity_id) == 'off' }}"
              then:
                - stop: "Already up to date"
              else:
                - alias: Install the update
                  action: update.install
                  target:
                    entity_id: "{{ callback_entity_id }}"
                  data:
                    # Not every update entity supports backups (feature flag 8); asking for one would make the install fail
                    backup: >
                      {{ take_backup and ((state_attr(callback_entity_id, 'supported_features') | int(0)) | bitwise_and(8)) > 0 }}

    # ════════════════════════════════════════════════════════════════════════
    # MOBILE APP CALLBACK - SKIP UPDATE
    # ════════════════════════════════════════════════════════════════════════
    - alias: Handle Mobile App skip callback
      conditions:
        - "{{ trigger.id == 'mobile_callback' }}"
        - "{{ callback_action == 'skip_update' }}"
        # Only our own, monitored update entities (other automations/apps use this event too)
        - "{{ callback_entity_id in update_entities }}"
      sequence:
        - alias: Log callback data for debugging
          action: system_log.write
          data:
            message: "Skip callback received - Action: {{ callback_action }}, Raw tag: {{ trigger.event.data.tag }}, Clean Entity: {{ callback_entity_id }}"
            level: info
            logger: blueprints.update_notifications

        - alias: Check if entity_id is valid
          if:
            - condition: template
              value_template: "{{ callback_entity_id == '' or states(callback_entity_id) == 'unknown' }}"
          then:
            - stop: "Invalid update entity"
          else:
            - alias: Check if update is still available
              if:
                - condition: template
                  value_template: "{{ states(callback_entity_id) == 'off' }}"
              then:
                - stop: "Already up to date"
              else:
                - alias: Skip the update
                  action: update.skip
                  target:
                    entity_id: "{{ callback_entity_id }}"

  default:
    - alias: Log install/skip callbacks that could not be handled
      if:
        - condition: template
          value_template: "{{ trigger.id == 'mobile_callback' and callback_action in ['install_update', 'skip_update'] }}"
      then:
        - action: system_log.write
          data:
            message: "Unhandled callback - Trigger: {{ trigger.id }}, Action: {{ callback_action }}, Entity: {{ callback_entity_id }}, Full event: {{ trigger.event }}"
            level: warning
            logger: blueprints.update_notifications
