# Version: 1.0.0
blueprint:
  domain: automation
  name: "🔥 Simple Heating"
  author: r3mcos3
  source_url: https://github.com/r3mcos3/blueprints/blob/main/simple_heating/simple_heating.yaml
  homeassistant:
    min_version: 2025.12.0
  description: >
    📦 [Version 1.0.0] Dead-simple heating: a Home temperature and an Away temperature, 🏠 / 🏃 switched by who is home and by your sleep schedule. 🌙


    Features:

    - 🏠 Home / 🏃 Away temperature, both adjustable

    - 👥 2 required persons + 2 optional persons: anyone home = Home, nobody home = Away

    - ✋ Manual changes on the thermostat are respected and held until you change them again, everybody leaves, or you go to sleep

    - 🌙 Sleeping = Away temperature, ☀️ morning = back to Home (fixed times or an optional sleep switch)

    - 🛡️ Restart-safe, ignores unavailable persons and thermostat
  input:
    # ===== REQUIRED =====
    climate_entity:
      name: "🌡️ Climate Entity"
      description: >
        The heater / thermostat to control (e.g. climate.kachel). Its hvac mode should be on
        (heat); this blueprint only sets the target temperature.
      selector:
        entity:
          filter:
            - domain: climate

    person_1:
      name: "👤 Person 1"
      description: "First person whose presence is tracked (required)."
      selector:
        entity:
          filter:
            - domain: person

    person_2:
      name: "👤 Person 2"
      description: "Second person whose presence is tracked (required)."
      selector:
        entity:
          filter:
            - domain: person

    # ===== TEMPERATURES (COLLAPSED) =====
    temperature_settings:
      name: "🌡️ Temperatures"
      icon: mdi:thermometer
      collapsed: true
      input:
        home_temp:
          name: "🏠 Home Temperature"
          description: "Target temperature when somebody is home and awake."
          default: 20
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        away_temp:
          name: "🏃 Away Temperature"
          description: "Target temperature when nobody is home, and while sleeping."
          default: 15
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

    # ===== SLEEP SCHEDULE (COLLAPSED) =====
    sleep_settings:
      name: "🌙 Sleep Schedule"
      icon: mdi:sleep
      collapsed: true
      input:
        sleep_time:
          name: "🌙 Bedtime"
          description: >
            From this time the Away temperature is used. Ignored when a sleep switch is selected below.
          default: "23:00:00"
          selector:
            time:

        wake_time:
          name: "☀️ Wake-up Time"
          description: >
            From this time the Home temperature is used again (if somebody is home).
            Ignored when a sleep switch is selected below.
          default: "07:00:00"
          selector:
            time:

        sleep_helper:
          name: "🛏️ Sleep Switch (optional)"
          description: >
            Optional input_boolean that is ON while you sleep (e.g. toggled by a bedtime button or
            a phone sleep focus). When set, it replaces the fixed bedtime / wake-up times.
            Leave empty to use the fixed times.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean

    # ===== EXTRA PERSONS (COLLAPSED) =====
    extra_persons:
      name: "👥 Extra Persons"
      icon: mdi:account-multiple-plus
      collapsed: true
      input:
        person_3:
          name: "👤 Person 3 (optional)"
          description: "Third person to track. Leave empty if not needed."
          default: []
          selector:
            entity:
              filter:
                - domain: person

        person_4:
          name: "👤 Person 4 (optional)"
          description: "Fourth person to track. Leave empty if not needed."
          default: []
          selector:
            entity:
              filter:
                - domain: person

# Runs are queued so a startup run (which waits for sensors) can never be cancelled
# by a presence change, and runs never overlap. Every run re-reads the current state,
# so queued runs are idempotent.
mode: queued
max: 10
max_exceeded: silent

# Persons list for the template triggers (empty optional inputs are dropped)
trigger_variables:
  tv_p1: !input person_1
  tv_p2: !input person_2
  tv_p3: !input person_3
  tv_p4: !input person_4
  tv_persons: >
    {{ [tv_p1, tv_p2, tv_p3, tv_p4] | select('string') | reject('eq', '') | list }}

triggers:
  # ===== RESTART / RELOAD / THERMOSTAT BACK ONLINE: RE-SYNC =====
  - trigger: homeassistant
    event: start
    id: ha_start

  - trigger: event
    event_type: automation_reloaded
    id: automation_reload

  - trigger: state
    entity_id: !input climate_entity
    from:
      - unavailable
      - unknown
    id: climate_back

  # ===== PRESENCE =====
  # Template triggers fire on the false -> true edge only, so a 2nd person arriving
  # while somebody is already home (or leaving while somebody stays) does nothing.
  - trigger: template
    value_template: >
      {{ tv_persons | select('is_state', 'home') | list | length > 0 }}
    id: first_arrival

  # Everybody that is *known* is away. Unavailable / unknown persons are ignored.
  - trigger: template
    value_template: >
      {% set known = tv_persons | reject('is_state', 'unavailable') | reject('is_state', 'unknown') | list %}
      {{ known | length > 0 and (known | select('is_state', 'home') | list | length) == 0 }}
    id: all_left

  # ===== SLEEP: FIXED TIMES =====
  - trigger: time
    at: !input sleep_time
    id: sleep_time

  - trigger: time
    at: !input wake_time
    id: wake_time

  # ===== SLEEP: OPTIONAL SWITCH =====
  - trigger: state
    entity_id: !input sleep_helper
    to: "on"
    id: sleep_helper_on

  - trigger: state
    entity_id: !input sleep_helper
    to: "off"
    id: sleep_helper_off

conditions: []

actions:
  # ===== STATIC SETTINGS =====
  - variables:
      trigger_id: "{{ trigger.id | default('manual') if trigger is defined else 'manual' }}"
      climate: !input climate_entity
      p1: !input person_1
      p2: !input person_2
      p3: !input person_3
      p4: !input person_4
      persons: >
        {{ [p1, p2, p3, p4] | select('string') | reject('eq', '') | list }}
      temp_home: !input home_temp
      temp_away: !input away_temp
      sleep_at: !input sleep_time
      wake_at: !input wake_time
      sleep_helper: !input sleep_helper
      sleep_helper_configured: "{{ sleep_helper is string and sleep_helper | length > 0 }}"

  # ===== A SLEEP SWITCH REPLACES THE FIXED TIMES =====
  - condition: template
    value_template: >
      {{ not (trigger_id in ['sleep_time', 'wake_time'] and sleep_helper_configured) }}

  # ===== AFTER A RESTART / RELOAD: GIVE PERSONS AND THERMOSTAT TIME TO COME UP =====
  - if:
      - condition: template
        value_template: "{{ trigger_id in ['ha_start', 'automation_reload'] }}"
    then:
      - delay:
          seconds: 30

  # ===== CALCULATE CURRENT STATE (read after any delay, so it is never stale) =====
  - variables:
      climate_ok: "{{ states(climate) not in ['unavailable', 'unknown'] }}"
      known: >
        {{ persons | reject('is_state', 'unavailable') | reject('is_state', 'unknown') | list }}
      anyone_home: "{{ persons | select('is_state', 'home') | list | length > 0 }}"
      presence_known: "{{ known | length > 0 }}"
      current_setpoint: "{{ state_attr(climate, 'temperature') | float(none) }}"

      # Sleep switch if configured, otherwise the fixed times (handles bedtime before midnight)
      is_sleeping: >
        {% if sleep_helper_configured %}
          {{ is_state(sleep_helper, 'on') }}
        {% else %}
          {% set n = now().strftime('%H:%M:%S') %}
          {% if sleep_at > wake_at %}
            {{ n >= sleep_at or n < wake_at }}
          {% else %}
            {{ sleep_at <= n < wake_at }}
          {% endif %}
        {% endif %}

      # What the thermostat *should* be on right now: 'away', 'home' or 'unknown'
      # (unknown = nobody's presence can be determined; then we leave things alone)
      desired_mode: >
        {% if is_sleeping %}away
        {% elif not presence_known %}unknown
        {% elif anyone_home %}home
        {% else %}away{% endif %}
      target_temp: >
        {% if desired_mode == 'home' %}{{ temp_home }}
        {% elif desired_mode == 'away' %}{{ temp_away }}
        {% else %}none{% endif %}

      # Events that *replace* any manual setting (the three ways an override ends,
      # plus the morning). Each one is guarded against a stale queued run.
      is_forced_event: >
        {{ (trigger_id in ['sleep_time', 'sleep_helper_on', 'wake_time', 'sleep_helper_off']
              and desired_mode != 'unknown')
           or (trigger_id == 'all_left' and desired_mode == 'away')
           or (trigger_id == 'first_arrival' and desired_mode == 'home') }}

      # Re-sync (restart, reload, thermostat back online, manual run) only corrects a
      # thermostat that still sits on one of our own values. Any other value is a
      # manual setting and is kept.
      is_managed_value: >
        {{ current_setpoint is none
           or (current_setpoint - temp_home) | abs <= 0.3
           or (current_setpoint - temp_away) | abs <= 0.3 }}
      is_resync_event: >
        {{ trigger_id in ['ha_start', 'automation_reload', 'climate_back', 'manual'] }}

      should_write: >
        {{ climate_ok
           and desired_mode != 'unknown'
           and (is_forced_event or (is_resync_event and is_managed_value))
           and (current_setpoint is none or (current_setpoint - target_temp | float) | abs > 0.05) }}

  # ===== APPLY =====
  - if:
      - condition: template
        value_template: "{{ should_write }}"
    then:
      - action: climate.set_temperature
        target:
          entity_id: "{{ climate }}"
        data:
          temperature: "{{ target_temp | float }}"
